<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>足球追踪 · Touchline</title><link rel="stylesheet" href="/materials.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/tracking.css"><script type="module" src="/tracking.js"></script></head><body><aside class="navigation"><a class="brand" href="/materials"><span>Touchline<small>足球分析工作室</small></span></a><p class="nav-label">工作空间</p><nav aria-label="主导航"><a href="/materials" data-page="materials" class="">素材管理</a><a href="/calibration" data-page="calibration" class="">场地标定</a><a href="/identity" data-page="identity" class="">人物识别</a><a href="/tracking" data-page="tracking" class="selected">足球追踪</a><a href="/report" data-page="report" class="">分析报告</a></nav><div class="nav-bottom">本地工作空间</div></aside><div class="workspace"><header class="topbar"><span>工作空间 / <strong>足球追踪</strong></span><a href="/materials">返回素材管理</a></header><main><header class="page-heading"><div><h1>足球追踪</h1><p>逐帧检查足球候选、真实观测与缺失区间。</p></div><label class="run-picker">分析运行<select id="run-select" aria-label="选择分析运行"></select></label></header><p id="material-meta" class="material-meta"></p><div id="notice" class="notice" role="status">正在读取对应素材…</div><section id="empty" class="panel empty" hidden><h2>这条素材还没有已完成的运行</h2><p>先到追踪工作台完成人物分析，再回到这里继续。</p><a id="workbench" href="/">打开追踪工作台</a></section><div id="work-area" hidden><div class="work-grid"><section class="panel viewer"><div class="panel-head"><h2>视频与轨迹回放</h2><span id="frame-label">等待素材</span></div><div class="video-surface"><canvas id="video-canvas" width="1280" height="720" aria-label="视频帧与检测叠加"></canvas></div><div class="transport"><button id="previous" aria-label="上一帧">↤</button><button id="play" aria-label="播放或暂停">▶</button><button id="next" aria-label="下一帧">↦</button><input id="frame-slider" type="range" aria-label="视频时间轴" min="0" max="1" value="0"><input id="frame-number" type="number" aria-label="源帧号" min="0" value="0"><button id="jump">跳转</button></div><p id="frame-info" class="hint"></p></section><aside class="panel controls"><h2>足球追踪</h2><label>检测模型<select id="model"></select></label><p id="model-info" class="hint"></p><button id="run-ball" class="primary">运行足球追踪</button><progress id="progress" max="1" value="0"></progress><p id="job" role="status">等待任务</p><label>已完成结果版本<select id="versions"></select></label><div id="ball-summary" class="data-summary">尚无足球结果</div><h3>缺失帧复核</h3><p class="hint">缺失保持为空，不插值。点击源帧定位画面。</p><div id="missing" class="missing-list"></div></aside></div><section class="panel"><div class="panel-head"><h2>足球近似场地投影</h2><span id="projection-status">仅图像坐标</span></div><svg id="ball-pitch" class="pitch" aria-label="足球轨迹投影"></svg><p class="hint">投影按地面平面近似，空中球位置仅供参考。缺失帧之间不连线。</p></section></div><footer class="page-footnote">Touchline 足球分析工作室</footer></main></div></body></html>

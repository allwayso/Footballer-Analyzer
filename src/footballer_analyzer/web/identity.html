<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物识别 · Touchline</title><link rel="stylesheet" href="/materials.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/identity.css"><script type="module" src="/identity.js"></script></head><body><aside class="navigation"><a class="brand" href="/materials"><span>Touchline<small>足球分析工作室</small></span></a><p class="nav-label">工作空间</p><nav aria-label="主导航"><a href="/materials" data-page="materials" class="">素材管理</a><a href="/calibration" data-page="calibration" class="">场地标定</a><a href="/identity" data-page="identity" class="selected">人物识别</a><a href="/tracking" data-page="tracking" class="">足球追踪</a><a href="/report" data-page="report" class="">分析报告</a></nav><div class="nav-bottom">本地工作空间</div></aside><div class="workspace"><header class="topbar"><span>工作空间 / <strong>人物识别</strong></span><a href="/materials">返回素材管理</a></header><main><header class="page-heading"><div><h1>人物识别</h1><p>核对人物检测与轨迹，为有效区间绑定球员身份。</p></div><label class="run-picker">分析运行<select id="run-select" aria-label="选择分析运行"></select></label></header><p id="material-meta" class="material-meta"></p><div id="notice" class="notice" role="status">正在读取对应素材…</div><section id="empty" class="panel empty" hidden><h2>这条素材还没有已完成的运行</h2><p>先到追踪工作台完成人物分析，再回到这里继续。</p><a id="workbench" href="/">打开追踪工作台</a></section><div id="work-area" hidden><div class="work-grid"><section class="panel viewer"><div class="panel-head"><h2>视频与轨迹回放</h2><span id="frame-label">等待素材</span></div><div class="video-surface"><canvas id="video-canvas" width="1280" height="720" aria-label="视频帧与检测叠加"></canvas></div><div class="transport"><button id="previous" aria-label="上一帧">↤</button><button id="play" aria-label="播放或暂停">▶</button><button id="next" aria-label="下一帧">↦</button><input id="frame-slider" type="range" aria-label="视频时间轴" min="0" max="1" value="0"><input id="frame-number" type="number" aria-label="源帧号" min="0" value="0"><button id="jump">跳转</button></div><p id="frame-info" class="hint"></p></section><aside class="panel controls"><h2>轨迹身份绑定</h2><label>轨迹<select id="track"></select></label><div class="track-list" id="track-list"></div><form id="binding-form"><label>球员档案<select id="player"></select></label><label>球队<select id="team"><option value="home">主队</option><option value="away">客队</option><option value="unknown">未知</option></select></label><div class="form-grid"><label>起始帧（含）<input id="start" type="number" required></label><label>结束帧（不含）<input id="end" type="number" required></label></div><div class="action-row"><button class="primary">保存绑定</button><button type="button" id="exclude">排除此区间</button></div></form><details><summary>新建 / 更新球员档案</summary><form id="player-form"><label>唯一 ID<input id="player-id" pattern="[A-Za-z0-9_-]{1,64}" required placeholder="例如 home_10"></label><label>球员姓名<input id="player-name" required maxlength="80"></label><button>保存球员档案</button></form></details><p class="hint">单条轨迹可分段绑定。修改身份后，请在分析报告页重新生成报告。</p></aside></div><section class="panel"><div class="panel-head"><h2>绑定与排除历史</h2><span>源帧区间左闭右开</span></div><div class="table-scroll"><table><thead><tr><th>轨迹</th><th>区间</th><th>球员</th><th>状态 / 球队</th><th>操作</th></tr></thead><tbody id="history"></tbody></table></div></section></div><footer class="page-footnote">Touchline 足球分析工作室</footer></main></div></body></html>

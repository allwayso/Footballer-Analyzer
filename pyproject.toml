[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footballer-analyzer"
version = "0.1.0"
description = "Local football tracking, calibration and player motion review"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<6",
  "ultralytics>=8.3,<9",
  "supervision>=0.27,<0.28",
  "scikit-learn>=1.6,<2",
  "scipy>=1.12,<2",
  "PyYAML>=6,<7",
  "pyarrow>=19",
  "matplotlib>=3.9,<4",
]

[project.scripts]
footballer-analyzer = "footballer_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
footballer_analyzer = ["web/*.html", "web/*.css", "web/*.js", "web/demo/*.html", "web/demo/*.css", "web/demo/*.js", "web/demo/*.py", "web/demo/*.cmd"]
